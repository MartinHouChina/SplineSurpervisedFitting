<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">v16 minimum-complexity B-spline fitting pipeline</title>
  <desc id="desc">An ordered point cloud passes through geometry and parameter encoding, dense candidate generation, contextual one-shot selection, subset-conditioned parameter and knot relocation, and one standard B-spline refit. Training-only subset exploration supplies fit-error supervision.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#172554" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 38px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 19px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #475569; }
      .box-title { font: 700 22px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #0f172a; }
      .body { font: 400 17px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #334155; }
      .small { font: 400 15px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #475569; }
      .badge { font: 700 15px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: white; }
      .arrow { stroke: #334155; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .train-arrow { stroke: #7c3aed; stroke-width: 2.5; stroke-dasharray: 8 7; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="760" rx="24" fill="url(#bg)"/>
  <text x="800" y="60" text-anchor="middle" class="title">v16：阈值约束下的候选生成、一次性筛选与联合重定位</text>
  <text x="800" y="92" text-anchor="middle" class="subtitle">部署：一次网络前向 + 一个离散 KeepMask + 一次标准三次 B 样条 refit</text>

  <g filter="url(#shadow)">
    <rect x="35" y="145" width="205" height="250" rx="22" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <rect x="35" y="145" width="205" height="47" rx="22" fill="#2563eb"/>
    <rect x="35" y="169" width="205" height="23" fill="#2563eb"/>
    <text x="137" y="176" text-anchor="middle" class="badge">1  输入</text>
    <text x="137" y="230" text-anchor="middle" class="box-title">有序点云 Q</text>
    <text x="137" y="261" text-anchor="middle" class="body">[B, M, D]</text>
    <polyline points="65,325 92,300 117,313 145,270 174,291 211,245" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#ffffff" stroke="#2563eb" stroke-width="3">
      <circle cx="65" cy="325" r="5"/><circle cx="92" cy="300" r="5"/><circle cx="117" cy="313" r="5"/>
      <circle cx="145" cy="270" r="5"/><circle cx="174" cy="291" r="5"/><circle cx="211" cy="245" r="5"/>
    </g>
    <text x="137" y="366" text-anchor="middle" class="small">归一化 MSE 阈值 ε</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="285" y="145" width="240" height="250" rx="22" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
    <rect x="285" y="145" width="240" height="47" rx="22" fill="#0f766e"/>
    <rect x="285" y="169" width="240" height="23" fill="#0f766e"/>
    <text x="405" y="176" text-anchor="middle" class="badge">2  几何与参数编码</text>
    <text x="405" y="228" text-anchor="middle" class="box-title">GeometryEncoder</text>
    <text x="405" y="260" text-anchor="middle" class="body">逐点特征 Flocal</text>
    <text x="405" y="288" text-anchor="middle" class="body">全局特征 Fglobal</text>
    <line x1="315" y1="312" x2="495" y2="312" stroke="#cbd5e1" stroke-width="2"/>
    <text x="405" y="345" text-anchor="middle" class="box-title">ParameterHead</text>
    <text x="405" y="373" text-anchor="middle" class="small">弦长 + 有界残差 → t₀</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="570" y="145" width="245" height="250" rx="22" fill="#ffffff" stroke="#0369a1" stroke-width="2"/>
    <rect x="570" y="145" width="245" height="47" rx="22" fill="#0369a1"/>
    <rect x="570" y="169" width="245" height="23" fill="#0369a1"/>
    <text x="692" y="176" text-anchor="middle" class="badge">3  稠密候选</text>
    <text x="692" y="230" text-anchor="middle" class="box-title">CandidateKnotHead</text>
    <text x="692" y="264" text-anchor="middle" class="body">局部 Gaussian</text>
    <text x="692" y="291" text-anchor="middle" class="body">cross-attention</text>
    <g fill="#0284c7">
      <path d="M610 329 l8 -8 l8 8 l-8 8z"/><path d="M642 329 l8 -8 l8 8 l-8 8z"/>
      <path d="M674 329 l8 -8 l8 8 l-8 8z"/><path d="M706 329 l8 -8 l8 8 l-8 8z"/>
      <path d="M738 329 l8 -8 l8 8 l-8 8z"/><path d="M770 329 l8 -8 l8 8 l-8 8z"/>
    </g>
    <text x="692" y="371" text-anchor="middle" class="small">U₀[B,Kc] + candidate tokens</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="860" y="145" width="250" height="250" rx="22" fill="#ffffff" stroke="#c2410c" stroke-width="2"/>
    <rect x="860" y="145" width="250" height="47" rx="22" fill="#c2410c"/>
    <rect x="860" y="169" width="250" height="23" fill="#c2410c"/>
    <text x="985" y="176" text-anchor="middle" class="badge">4  一次性筛选</text>
    <text x="985" y="228" text-anchor="middle" class="box-title">Contextual Selector</text>
    <text x="985" y="262" text-anchor="middle" class="body">候选 self-attention</text>
    <text x="985" y="290" text-anchor="middle" class="body">点特征 cross-attention</text>
    <text x="985" y="318" text-anchor="middle" class="small">位置 / 左右间距 / 覆盖 / ε</text>
    <rect x="895" y="330" width="180" height="57" rx="17" fill="#ffedd5" stroke="#ea580c"/>
    <text x="985" y="353" text-anchor="middle" class="body">centered score − β</text>
    <text x="985" y="376" text-anchor="middle" class="small">probability mass → Top-K × 1</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1155" y="145" width="245" height="250" rx="22" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
    <rect x="1155" y="145" width="245" height="47" rx="22" fill="#7c3aed"/>
    <rect x="1155" y="169" width="245" height="23" fill="#7c3aed"/>
    <text x="1277" y="176" text-anchor="middle" class="badge">5  集合条件解码</text>
    <text x="1277" y="228" text-anchor="middle" class="box-title">Selected-only KV</text>
    <text x="1277" y="264" text-anchor="middle" class="body">参数 t₀ → t₁</text>
    <text x="1277" y="294" text-anchor="middle" class="body">U₀ warp 到 t₁</text>
    <text x="1277" y="324" text-anchor="middle" class="body">存活节点联合重定位</text>
    <text x="1277" y="364" text-anchor="middle" class="small">有序、最小间距投影 → U₁</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1445" y="145" width="125" height="250" rx="22" fill="#ffffff" stroke="#15803d" stroke-width="2"/>
    <rect x="1445" y="145" width="125" height="47" rx="22" fill="#15803d"/>
    <rect x="1445" y="169" width="125" height="23" fill="#15803d"/>
    <text x="1507" y="176" text-anchor="middle" class="badge">6  refit</text>
    <text x="1507" y="234" text-anchor="middle" class="box-title">标准</text>
    <text x="1507" y="262" text-anchor="middle" class="box-title">B 样条</text>
    <text x="1507" y="304" text-anchor="middle" class="body">× 1</text>
    <text x="1507" y="342" text-anchor="middle" class="small">P, C, U</text>
    <text x="1507" y="368" text-anchor="middle" class="small">MSE</text>
  </g>

  <path d="M240 270 H273" class="arrow"/>
  <path d="M525 270 H558" class="arrow"/>
  <path d="M815 270 H848" class="arrow"/>
  <path d="M1110 270 H1143" class="arrow"/>
  <path d="M1400 270 H1433" class="arrow"/>

  <g filter="url(#shadow)">
    <rect x="285" y="485" width="1115" height="190" rx="22" fill="#faf5ff" stroke="#8b5cf6" stroke-width="2"/>
    <rect x="313" y="510" width="138" height="32" rx="16" fill="#7c3aed"/>
    <text x="382" y="532" text-anchor="middle" class="badge">仅训练时执行</text>
    <text x="485" y="583" class="box-title">真实标准 B 样条集合评价</text>
    <text x="485" y="617" class="body">IID Bernoulli + 删除 / 添加 + score-ranked 多尺度预算</text>
    <text x="485" y="647" class="small">可行：先最少 K，再最小 MSE；不可行：只降低 MSE</text>
    <rect x="1025" y="526" width="325" height="116" rx="18" fill="#ffffff" stroke="#a78bfa"/>
    <text x="1187" y="560" text-anchor="middle" class="box-title">训练反馈</text>
    <text x="1187" y="591" text-anchor="middle" class="body">策略梯度 + mask / count / rank 蒸馏</text>
    <text x="1187" y="619" text-anchor="middle" class="body">参数 / 节点可微 refit 梯度</text>
  </g>

  <path d="M985 395 V455 H630 V475" class="train-arrow"/>
  <path d="M1277 395 V475" class="train-arrow"/>
  <path d="M1025 584 H918 V430 H985 V407" class="train-arrow"/>

  <text x="800" y="722" text-anchor="middle" class="subtitle">节点数 = KeepMask.sum()；无 CountHead、无部署搜索、无离线硬剪枝教师</text>
</svg>
